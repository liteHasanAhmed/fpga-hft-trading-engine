name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Fixtures are up to date
        run: python3 fixtures/gen.py && git diff --exit-code fixtures/
      - name: Demo experiment runs and is deterministic
        run: |
          cargo run --release -p hft -- run --config experiments/demo.toml --data fixtures/stale.log --out /tmp/r1
          cargo run --release -p hft -- run --config experiments/demo.toml --data fixtures/stale.log --out /tmp/r2
          diff /tmp/r1/metrics.json /tmp/r2/metrics.json
